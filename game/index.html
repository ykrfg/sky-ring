<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0d2438">
<meta name="description" content="SKY RING: take off from the island runway, thread the numbered ring course and bring the Raven home. A WebGL flight game that runs entirely in the browser.">
<title>SKY RING — ring course flight</title>
<style>
  :root {
    color-scheme: dark;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #0d2438;
  }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
  /* The stage is a 16:9 box fitted inside the window and centred; whatever
     window is left around it stays plain dark (letterbox / pillarbox), and
     the picture inside is never stretched. Both canvases share the exact
     same box, so the HUD layer always aligns with the WebGL layer. */
  #stage { position: fixed; inset: 0; background: #050f18; }
  #view, #hud {
    position: absolute; left: 50%; top: 50%; display: block;
    width: min(100vw, 177.78vh); height: min(56.25vw, 100vh);
    /* Dynamic viewport units track the mobile browser chrome showing and
       hiding; browsers without them keep the vh sizing above. */
    width: min(100vw, 177.78dvh); height: min(56.25vw, 100dvh);
    transform: translate(-50%, -50%);
  }
  #hud { pointer-events: auto; cursor: default; }
  /* Announced by screen readers, never painted. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #boot {
    position: fixed; inset: auto 0 46%; text-align: center; pointer-events: none;
    color: #eaf9ff; font: 600 14px ui-monospace, monospace; letter-spacing: 0.12em;
    text-shadow: 0 2px 12px #07344a;
  }
  #boot[hidden] { display: none; }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<main id="stage" aria-label="SKY RING, a 3D flight game">
  <canvas id="view" aria-hidden="true"></canvas>
  <canvas id="hud" aria-label="Flight instruments and game controls"></canvas>
  <div id="boot" aria-hidden="true">SPOOLING UP THE ENGINE</div>
</main>
<p id="status" role="status" aria-live="polite">Loading SKY RING.</p>
<noscript><p style="text-align:center; color:#eaf9ff;">SKY RING needs JavaScript to fly.</p></noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
